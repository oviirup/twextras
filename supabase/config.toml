#:schema https://supabase.com/schemas/config/v1.json

# Minimal local config: database, storage, auth, Studio.
# Reference: https://supabase.com/docs/guides/local-development/cli/config
# After editing, run `supabase stop` then `supabase start`.

project_id = "backend"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Must match your remote Postgres major version.
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
enable_signup = true

# Not needed for a database + storage setup.
[realtime]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false

[local_smtp]
enabled = false

[experimental.pgdelta]
enabled = true
